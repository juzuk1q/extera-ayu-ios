name: Build iO Telegram iOS (.ipa)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Bazel build configuration"
        required: true
        default: "release_arm64"
        type: choice
        options:
          - release_arm64
          - debug_arm64
  push:
    branches:
      - extera-ayu-ios

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select latest available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Prepare build configuration
        env:
          CUSTOM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          CUSTOM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          CUSTOM_BUNDLE_ID: ${{ secrets.TELEGRAM_BUNDLE_ID }}
        run: |
          cp build-system/appstore-configuration.json build-config.json
          python3 - <<'PY'
          import json, os
          with open("build-config.json", "r") as f:
              cfg = json.load(f)
          if os.environ.get("CUSTOM_API_ID"):
              cfg["api_id"] = os.environ["CUSTOM_API_ID"]
          if os.environ.get("CUSTOM_API_HASH"):
              cfg["api_hash"] = os.environ["CUSTOM_API_HASH"]
          if os.environ.get("CUSTOM_BUNDLE_ID"):
              cfg["bundle_id"] = os.environ["CUSTOM_BUNDLE_ID"]
          with open("build-config.json", "w") as f:
              json.dump(cfg, f, indent=2)
          PY

      - name: Refresh expired fake provisioning profiles
        run: |
          set -euo pipefail
          KEYCHAIN="refresh-profiles.keychain"
          cleanup() {
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
          security create-keychain -p "temp123" "$KEYCHAIN"
          OLD_KEYCHAINS=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$KEYCHAIN" $OLD_KEYCHAINS
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "temp123" "$KEYCHAIN"
          security import build-system/fake-codesigning/certs/SelfSigned.p12 -k "$KEYCHAIN" -P "" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "temp123" "$KEYCHAIN"

          IDENTITY="Apple Distribution: Telegram FZ-LLC (C67CF9S4VU)"
          for profile in build-system/fake-codesigning/profiles/*.mobileprovision; do
            TMP_PLIST=$(mktemp /tmp/profile.XXXXXX)
            security cms -D -i "$profile" -o "$TMP_PLIST"
            python3 - "$TMP_PLIST" <<'PY'
          import datetime, plistlib, sys
          path = sys.argv[1]
          with open(path, "rb") as f:
              pl = plistlib.load(f)
          pl["ExpirationDate"] = datetime.datetime(2030, 10, 28, 17, 6, 30)
          pl["TimeToLive"] = 1820
          with open(path, "wb") as f:
              plistlib.dump(pl, f, fmt=plistlib.FMT_XML)
          PY
            security cms -S -k "$KEYCHAIN" -N "$IDENTITY" -i "$TMP_PLIST" -o "$profile"
            openssl smime -inform der -verify -noverify -in "$profile" >/dev/null
            rm -f "$TMP_PLIST"
          done

      - name: Import fake codesigning certificates
        run: |
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - name: Build .ipa with Bazel
        run: |
          BUILD_NUMBER_OFFSET=$(cat build_number_offset 2>/dev/null || echo "0")
          BUILD_NUMBER=$(( ${GITHUB_RUN_NUMBER:-1} + BUILD_NUMBER_OFFSET ))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          mkdir -p build/artifacts
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --configurationPath="build-config.json" \
            --codesigningInformationPath="build-system/fake-codesigning" \
            --configuration="${{ github.event.inputs.configuration || 'release_arm64' }}" \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath="build/artifacts"

          ls -lh build/artifacts

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: iO-iOS-${{ env.BUILD_NUMBER }}
          path: build/artifacts/*.ipa
          if-no-files-found: error
          retention-days: 14

